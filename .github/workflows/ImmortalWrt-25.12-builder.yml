# ============================================================
# 1. 触发条件 (Triggers)
# ============================================================
name: Build OpenWrt Firmware

on:
  workflow_dispatch:  # 允许在网页端手动点击按钮触发
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

# ============================================================
# 2. 全局环境变量 (Environment Variables) https://github.com/fat4-alt/immortalwrt
# ============================================================
env:
  REPO_URL: https://github.com/fat4-alt/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: .config
  DIY_SH: diy.sh
  FREE_SPACE: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  # ★ 方案 1：5G 模块/拨号后的真实 WAN netdev 名（用户指定 wwan0）
  WAN_DEV: wwan0
  TZ: Asia/Shanghai

# ============================================================
# 3. 任务定义 (Jobs)
# ============================================================
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # --------------------------------------------------------
    # 步骤 1：检出当前仓库代码
    # --------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # --------------------------------------------------------
    # 步骤 2：清理磁盘空间 (OpenWrt 编译必备)
    # --------------------------------------------------------
    - name: Free Disk Space
      if: env.FREE_SPACE == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    # --------------------------------------------------------
    # 步骤 3：初始化编译环境 (安装依赖)
    # --------------------------------------------------------
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # --------------------------------------------------------
    # 步骤 4：克隆 OpenWrt 源码
    # git clone $REPO_URL -b $REPO_BRANCH openwrt
    # --------------------------------------------------------
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # --------------------------------------------------------
    # 步骤 5：加载自定义脚本 (DIY) 和更新 Feeds
    # --------------------------------------------------------
    - name: Load custom feeds & Update feeds
      run: |
        cd openwrt
        [ -e $GITHUB_WORKSPACE/$DIY_SH ] && mv $GITHUB_WORKSPACE/$DIY_SH ./diy.sh
        chmod +x ./diy.sh
        ./diy.sh
        echo 'src-git qmodem https://github.com/fat4-alt/QModem.git;stable' >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds update qmodem
        ./scripts/feeds install -a -p qmodem
        ./scripts/feeds install -a -f -p qmodem
        
    # --------------------------------------------------------
    # 步骤 6：生成配置文件 (.config)
    #   ★ 方案 1 注入必须在 make defconfig 之前：
    #     defconfig 会读 target.mk 的 DEFAULT_PACKAGES 重新生成 .config，
    #     若那时 hnat-detect 还没删掉，它会被重新拉回来，前面全白改。
    #   ★ 注入脚本会一并补上 fork 里没有的三个设备文件：
    #     dts / 02_network 的 fzs 分支 / filogic.mk 的 Device 定义
    # --------------------------------------------------------
    - name: Generate configuration file
      run: |
        cd openwrt
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && mv $GITHUB_WORKSPACE/$CONFIG_FILE .config
        echo "=== inject static HNAT (wan_dev=$WAN_DEV) ==="
        bash "$GITHUB_WORKSPACE/inject_static_hnat.sh"
        make defconfig
        echo "=== post-defconfig check ==="
        grep -n 'CONFIG_PACKAGE_hnat-detect' .config || true
        ! grep -q '^CONFIG_PACKAGE_hnat-detect=y' .config
        grep -n '^CONFIG_TARGET_mediatek_filogic_DEVICE_fzs_5gcpe-p5=y' .config
        grep -n '^CONFIG_NET_MEDIATEK_HNAT=y' target/linux/mediatek/filogic/config-6.12
        echo "=== defconfig OK ==="

    # --------------------------------------------------------
    # 步骤 7：下载依赖包
    # --------------------------------------------------------
    - name: Download packages
      run: |
        cd openwrt
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # --------------------------------------------------------
    # 步骤 8：编译固件
    # --------------------------------------------------------
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # --------------------------------------------------------
    # 步骤 9：整理并上传固件 (Artifacts)
    # --------------------------------------------------------
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: ImmortalWrt-25.12_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
